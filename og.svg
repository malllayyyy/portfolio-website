<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <!-- CRT Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 0, 0, 0.25)" stroke-width="2"/>
    </pattern>
    <!-- Glow Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-title" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Void -->
  <rect width="1200" height="630" fill="#090c11"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Aurora Accent Glow -->
  <circle cx="1000" cy="150" r="300" fill="rgba(0, 245, 160, 0.06)" filter="url(#glow-title)"/>
  <circle cx="200" cy="500" r="250" fill="rgba(255, 158, 0, 0.04)" filter="url(#glow-title)"/>

  <!-- CRT Scanlines -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Outer HUD Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(0, 245, 160, 0.25)" stroke-width="2" rx="10"/>

  <!-- HUD Corner Brackets -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="square" filter="url(#glow-green)"/>
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="square" filter="url(#glow-green)"/>
  <path d="M 20 570 L 20 610 L 60 610" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="square" filter="url(#glow-green)"/>
  <path d="M 1140 610 L 1180 610 L 1180 570" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="square" filter="url(#glow-green)"/>

  <!-- Top Status Line -->
  <text x="80" y="110" font-family="monospace" font-size="20" fill="#00f5a0" letter-spacing="3" font-weight="bold">// SYSTEM READY · PLAYER 1 PORTFOLIO</text>

  <!-- Level 1 Badge -->
  <g transform="translate(80, 140)">
    <rect width="100" height="38" rx="6" fill="rgba(255, 158, 0, 0.15)" stroke="#ff9e00" stroke-width="1.5"/>
    <text x="50" y="25" font-family="monospace" font-size="16" fill="#ff9e00" font-weight="bold" text-anchor="middle" letter-spacing="1">LV. 1</text>
  </g>

  <!-- Title: MALAY -->
  <text x="80" y="310" font-family="sans-serif" font-size="110" fill="#e7eaf0" font-weight="900" letter-spacing="6" filter="url(#glow-title)">MALAY</text>
  <rect x="80" y="340" width="240" height="6" fill="#00f5a0" rx="3" filter="url(#glow-green)"/>

  <!-- Tagline -->
  <text x="80" y="420" font-family="sans-serif" font-size="28" fill="#00f5a0" font-weight="700" letter-spacing="2">FULL-STACK DEVELOPER · SYSTEMS BUILDER · GAME TINKERER</text>

  <!-- Divider Line -->
  <line x1="80" y1="475" x2="1120" y2="475" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Footer Specs -->
  <text x="80" y="530" font-family="monospace" font-size="20" fill="#8a93a6" letter-spacing="1">MISSION LOG &amp; FEATURED WORK</text>
  <text x="1120" y="530" font-family="monospace" font-size="20" fill="#00f5a0" font-weight="bold" text-anchor="end" letter-spacing="2">PRESS START ↵</text>
</svg>